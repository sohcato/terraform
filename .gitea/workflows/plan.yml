name: Plan

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
  TF_VAR_proxmox_ssh_private_key: ${{ secrets.PROXMOX_SSH_PRIVATE_KEY }}
  PG_CONN_STR: ${{ secrets.PG_CONN_STR }}

jobs:
  plan:
    runs-on: constructor-ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: stacks/prod/proxmox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Terraform changes
        id: changes
        working-directory: .
        env:
          BASE: ${{ gitea.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- modules stacks .gitea/workflows; then
            echo "terraform=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform changes in this pull request, skipping the plan."
          else
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.changes.outputs.terraform == 'true'
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Check formatting
        if: steps.changes.outputs.terraform == 'true'
        working-directory: .
        run: |
          if ! terraform fmt -check -recursive -diff; then
            echo "::error::Some files are not formatted. Run 'terraform fmt -recursive' from the repo root and push again."
            exit 1
          fi

      - name: Init
        if: steps.changes.outputs.terraform == 'true'
        run: terraform init

      - name: Validate
        if: steps.changes.outputs.terraform == 'true'
        run: terraform validate

      - name: Plan
        if: steps.changes.outputs.terraform == 'true'
        run: terraform plan -no-color -lock=false -out=tfplan | tee plan.txt

      - name: Comment plan on pull request
        if: steps.changes.outputs.terraform == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ gitea.token }}
          API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
          PR: ${{ gitea.event.pull_request.number }}
          SHA: ${{ gitea.event.pull_request.head.sha }}
        run: |
          SUMMARY=$(grep -E '^(Plan:|No changes\.)' plan.txt || echo "See the full plan below.")
          BODY=$(printf '### Terraform plan for %s\n\n**%s**\n\n<details><summary>Full plan</summary>\n\n```\n%s\n```\n\n</details>\n' \
            "${SHA:0:8}" "$SUMMARY" "$(tail -c 60000 plan.txt)")
          jq -n --arg body "$BODY" '{body: $body}' \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
              -d @- "$API/issues/$PR/comments" > /dev/null
          echo "Posted plan to pull request #$PR"
